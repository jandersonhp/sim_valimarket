<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="favicon.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValiMarket - Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 500px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .result-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f0fff4;
            border: 1px solid #9ae6b4;
            border-radius: 8px;
            display: none;
        }
        .result-box h3 {
            color: #276749;
            margin-bottom: 0.5rem;
        }
        .code-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2d3748;
            background: #f7fafc;
            padding: 0.8rem;
            border-radius: 8px;
            text-align: center;
            margin: 0.5rem 0;
            letter-spacing: 1px;
        }
        .copy-btn {
            background-color: #4299e1;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        .copy-btn:hover {
            background-color: #3182ce;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div>
                <h1>ValiMarket - Admin</h1>
                <p>Cadastro de novas empresas</p>
            </div>
            <a href="index.html" class="btn-back">← Início</a>
        </div>
    </header>

    <div class="admin-container">
        <form id="admin-form">
            <div class="form-group">
                <label for="adminCode">Sua Senha de Admin</label>
                <input type="password" id="adminCode" required>
            </div>
            <div class="form-group">
                <label for="nome">Nome da Empresa</label>
                <input type="text" id="nome" required>
            </div>
            <div class="form-group">
                <label for="telefone">WhatsApp da Empresa</label>
                <input type="tel" id="telefone" required>
            </div>
            <div class="form-group">
                <label for="endereco">Endereço da Empresa</label>
                <input type="text" id="endereco" required>
            </div>
            <div class="form-group">
                <label for="email">Email (opcional)</label>
                <input type="email" id="email">
            </div>
            <button type="submit" class="submit-btn">Cadastrar Empresa</button>
        </form>

        <div class="result-box" id="result-box">
            <h3>Empresa Cadastrada!</h3>
            <p>O código de acesso para a empresa é:</p>
            <div class="code-display" id="code-display"></div>
            <button class="copy-btn" onclick="copyCode()">Copiar Código</button>
            <p style="margin-top: 1rem; font-size: 0.9rem; color: #718096;">
                Envie este código para a empresa via WhatsApp. Ela usará para cadastrar produtos.
            </p>
        </div>

        <div class="error-message" id="error-message"></div>
    </div>

    <div class="admin-container" style="margin-top: 2rem;">
        <h2 style="color: #2d3748; margin-bottom: 1rem;">Gerenciar Empresas</h2>
        <div id="empresas-list"></div>
        <div class="error-message" id="empresas-error"></div>
    </div>

    <script>
        function copyCode() {
            const code = document.getElementById('code-display').textContent;
            navigator.clipboard.writeText(code);
            alert('Código copiado!');
        }

        document.getElementById('admin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const data = {
                adminCode: form.adminCode.value,
                nome: form.nome.value,
                telefone: form.telefone.value,
                endereco: form.endereco.value,
                email: form.email.value
            };

            try {
                const response = await fetch('/empresas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    const empresa = await response.json();
                    document.getElementById('code-display').textContent = empresa.codigoAcesso;
                    document.getElementById('result-box').style.display = 'block';
                    document.getElementById('error-message').style.display = 'none';
                    form.reset();
                    loadEmpresas();
                } else {
                    const error = await response.json();
                    document.getElementById('error-message').textContent = `Erro: ${error.error}`;
                    document.getElementById('error-message').style.display = 'block';
                    document.getElementById('result-box').style.display = 'none';
                }
            } catch (error) {
                document.getElementById('error-message').textContent = 'Erro ao conectar com o servidor.';
                document.getElementById('error-message').style.display = 'block';
                document.getElementById('result-box').style.display = 'none';
            }
        });

        async function loadEmpresas() {
            try {
                const response = await fetch('/empresas');
                if (!response.ok) {
                    document.getElementById('empresas-error').textContent = 'Erro ao carregar empresas';
                    document.getElementById('empresas-error').style.display = 'block';
                    return;
                }
                const empresas = await response.json();
                const container = document.getElementById('empresas-list');
                container.innerHTML = '';
                if (empresas.length === 0) {
                    container.innerHTML = '<p style="color: #718096; text-align: center; padding: 1rem;">Nenhuma empresa cadastrada.</p>';
                    return;
                }
                empresas.forEach(emp => {
                    const item = document.createElement('div');
                    item.style.cssText = 'display: flex; justify-content: space-between; align-items: flex-start; padding: 1rem; margin-bottom: 0.5rem; background: #f7fafc; border-radius: 8px; flex-wrap: wrap; gap: 0.5rem;';
                    item.innerHTML = `
                        <div>
                            <strong>${emp.nome}</strong><br>
                            <small style="color: #718096;">${emp.telefone} | ${emp.endereco}</small><br>
                            <small style="color: #38a169; font-weight: 500;">Código: ${emp.codigoAcesso || 'N/A'}</small>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 0.5rem; min-width: 120px;">
                            <input type="password" placeholder="Sua senha admin" id="admin-code-${emp.nome.replace(/\s/g, '-')}" style="padding: 0.4rem; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.9rem;">
                            <button class="delete-btn" onclick="deleteEmpresa('${emp.nome}', '${emp.telefone}')" style="background: #e53e3e; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer;">Excluir</button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (error) {
                document.getElementById('empresas-error').textContent = 'Erro ao carregar empresas';
                document.getElementById('empresas-error').style.display = 'block';
            }
        }

        async function deleteEmpresa(nome, telefone) {
            if (!confirm(`Tem certeza que deseja excluir a empresa "${nome}"? Todos os seus produtos também serão excluídos.`)) return;

            const adminCode = document.getElementById(`admin-code-${nome.replace(/\s/g, '-')}`).value;
            if (!adminCode) {
                alert('Digite sua senha de admin para excluir.');
                return;
            }

            try {
                const response = await fetch(`/admin/empresas`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminCode: adminCode, nome: nome, telefone: telefone })
                });

                if (response.ok) {
                    alert('Empresa excluída com sucesso!');
                    loadEmpresas();
                } else {
                    const error = await response.json();
                    alert(`Erro: ${error.error || 'Erro ao excluir'}`);
                }
            } catch (error) {
                alert('Erro ao conectar com o servidor.');
            }
        }

        // Carrega empresas ao iniciar
        loadEmpresas();
    </script>
</body>
</html>
